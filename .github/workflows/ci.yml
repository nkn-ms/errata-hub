name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで新しい push があれば古い実行をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc / lint / build は src/generated/prisma の型を参照するため先に生成
      - name: Generate Prisma Client
        run: npx prisma generate --generator client

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 実接続はしない。next build の静的生成時に Supabase クライアント生成と
          # Prisma アダプタの初期化が env を要求するためダミー値を渡す
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
