name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled を含めるのは「PR に e2e ラベルを付けたら e2e を回す」ため
    # （既定の opened/synchronize/reopened に加える。types を書くと既定は上書きなので明示する）。
    types: [opened, synchronize, reopened, labeled]

# GITHUB_TOKEN の権限を最小限に固定する。指定しないとリポジトリ既定値を継承するが、
# 既定値は設定画面から変えられるので、ワークフロー側で宣言しておく方が堅い
# （CodeQL の actions/missing-workflow-permissions の指摘）。
# このワークフローはチェックアウトして検証するだけで、書き込みは一切しない。
permissions:
  contents: read

# 古くなった実行を打ち切って CI の待ち時間を短くする。レーンは PR 単位（push は ref 単位）。
#
# ⚠️ 打ち切るのは「新しいコミットが来たとき」= pull_request の synchronize だけに限る。
# 1つの PR には opened / labeled / synchronize が数秒差で届き、既定の cancel-in-progress: true だと
# **同じコミットに対する実行同士が互いを打ち切り合う**。必須チェックの判定は同名チェックの
# 「最後の報告」を見るため、success の後に cancelled が届くと未達と判定されて PR がマージできなくなる
# （2026-07-29 に Dependabot の PR #128 で発生。同一 SHA に success 1件・cancelled 4件）。
# synchronize はコミットが変わったときにしか起きないので、この条件なら同一コミットで
# 打ち切りが起きない。push（main）は従来どおり古い実行を打ち切る。
# 出典: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action == 'synchronize' }}

jobs:
  ci:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # ローカル（nvm）と CI のバージョンを 1 か所で管理する
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc / lint / build は src/generated/prisma の型を参照するため先に生成
      - name: Generate Prisma Client
        run: npx prisma generate --generator client

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 実接続はしない。next build の静的生成時に Supabase クライアント生成と
          # Prisma アダプタの初期化が env を要求するためダミー値を渡す
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-publishable-key
          DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
          DIRECT_URL: postgresql://user:pass@localhost:5432/postgres

  # ─────────────────────────────────────────────────────────────
  # e2e（Playwright）。ローカルの検証手順をそのまま CI で再現する:
  #   supabase start → prisma migrate deploy → prisma db seed
  #   → バケット作成 → playwright test
  #
  # 実行タイミングは絞る（テストピラミッドの考え方＝ e2e は薄い層に保つ）:
  #   - main への push（＝マージ後）… 何かが漏れて main に入っていないかの安全網
  #   - PR に "e2e" ラベルが付いているとき … マージ前に任意で回す
  #   - Dependabot の PR … ラベルが付かないので明示的に含める（下記）
  # 開発中の毎 push では回さないので、内側の開発ループは軽い CI だけで速いまま。
  # ラベルの付け外しは gh pr edit <PR> --add-label e2e / --remove-label e2e。
  #
  # Dependabot の PR で必ず回す理由: **コードを1行も変えていないのに挙動が変わり得る**のは
  # 依存更新のときだから。例えばセッション Cookie の HttpOnly は @supabase/ssr が
  # cookieOptions を Set-Cookie まで運んでくれることに依存しており（src/lib/supabase/cookie-options.ts）、
  # ライブラリ側がそれをやめても型エラーにもならず、ログインも成功し続ける＝
  # e2e で実際の Cookie を見る以外に気づく手立てが無い。ここを回さないと、
  # 気づくのは main にマージして本番へ出た後（push トリガー）になってしまう。
  # 判定に github.actor ではなく PR の作成者を使うのは、人間が Dependabot のブランチに
  # 追加 push すると actor がその人に変わってしまうため。
  #
  # ⚠️ この job はリポジトリのシークレットを使わない（使い捨ての Supabase を CI 内に立て、
  #    接続情報は supabase status から取る）。Dependabot の PR はシークレットを読めないので、
  #    ここが崩れると Dependabot でだけ失敗するようになる。
  # ─────────────────────────────────────────────────────────────
  e2e:
    name: e2e (Playwright)
    needs: ci # 軽いチェックが落ちているときは重い e2e を走らせない（無駄打ち防止）
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --generator client

      # ローカル Supabase（Postgres + Auth + Storage）を CI ランナー内に Docker で立てる。
      # 使い捨て＝本番にもローカルにも触れない。
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # 起動した使い捨て Supabase の接続情報を後続ステップ／dev サーバーへ渡す。
      # キーを YAML に直書きせず supabase status から動的に取る（ローカル固有の値なので秘匿情報ではないが、
      # 版が変わっても壊れないように実値を1か所から引く）。
      - name: Export Supabase connection into env
        run: |
          STATUS=$(supabase status -o json)
          DB=$(echo "$STATUS" | jq -r .DB_URL)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$STATUS" | jq -r .PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(echo "$STATUS" | jq -r .SECRET_KEY)"
            # pooler は無効（config.toml）なので DATABASE_URL も直接接続でよい
            echo "DATABASE_URL=$DB"
            echo "DIRECT_URL=$DB"
          } >> "$GITHUB_ENV"

      # スキーマは本番と同じ Prisma Migrate で適用する（migrate deploy は DIRECT_URL を見る）。
      - name: Apply schema (prisma migrate deploy)
        run: npx prisma migrate deploy

      # シード（admin@local.test / reader@local.test / 本2冊・投稿1件）。
      # seed.ts は supabase status から接続情報を読むので env 不要・ローカル判定も通る。
      - name: Seed data
        run: npx prisma db seed

      # 画像添付テスト用の Storage バケット（report-images）。start だけでは作られない。
      - name: Seed storage buckets
        run: supabase seed buckets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # webServer（playwright.config.ts）が npm run dev を起動し、上で $GITHUB_ENV に入れた
      # 接続情報を継承する。BASE_URL は既定の localhost なので write-local project も有効。
      - name: Run e2e
        run: npx playwright test

      # 失敗時だけレポートを残す（原因追跡用）。
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
